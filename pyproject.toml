[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-ui-loop"
version = "0.1.0"
description = "Collect app screens with agent-device, evaluate them together, and generate visual proposals."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
mobile-ui-loop = "mobile_ui_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobile_ui_loop = ["web/*", "runtime/*.mjs"]
